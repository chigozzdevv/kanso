[package]
name = "kanso-coordinator"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace]
members = ["tests/settlement-token"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy"] }
ethnum = "=1.5.2"
near-mpc-contract-interface = { git = "https://github.com/near/mpc", rev = "9a8598d5a80fb06e403d60af825765b49674b7b2", features = ["near"] }
bitcoin = { version = "=0.32.7", default-features = false, features = ["std", "serde"] }
hex = "=0.4.3"
rlp = "=0.5.2"
bcs = "=0.1.6"
sui-sdk-types = { version = "=0.4.0", features = ["serde", "hash"] }
starknet-crypto = { version = "=0.8.1", default-features = false, features = ["alloc"] }
sha3 = "=0.10.8"
blake2 = "=0.10.6"
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy", "unit-testing"] }
serde_json = "1"
near-parameters = "=0.37.4"
ed25519-dalek = "=2.2.0"
k256 = { version = "=0.13.4", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
